name: FarmGuard AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Security Evaluation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python Syntax & Static Analysis
        run: |
          python -m compileall backend/app

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest -v

      - name: Run Adversarial Security Evaluation
        run: |
          cd backend
          python -m app.evaluation.adversarial_evaluator

      - name: Run Agent Behavioral & Trace Benchmark
        run: |
          cd backend
          python -m app.evaluation.agent_evaluator
