services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmguard-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://farmguard.ai}
      - API_AUTH_ENABLED=${API_AUTH_ENABLED:-false}
      - API_KEYS=${API_KEYS:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - OPENMETEO_BASE_URL=${OPENMETEO_BASE_URL:-https://api.open-meteo.com/v1/forecast}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
